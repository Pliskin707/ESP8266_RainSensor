<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Monitor Setup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }
        label input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
            cursor: pointer;
        }
        label input[type="checkbox"] + span {
            cursor: pointer;
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .alert {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: none;
        }
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Setup</h1>
        <p class="subtitle">Settings are stored in EEPROM and are retained after firmware update or power loss</p>
        
        <div id="successAlert" class="alert alert-success">Settings saved successfully!</div>
        <div id="errorAlert" class="alert alert-error"></div>
        
        <form id="setupForm">
            <div class="form-group">
                <label for="beeperEnabled">
                    <input type="checkbox" id="beeperEnabled" name="beeperEnabled">
                    Enable Beeper
                </label>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-primary">Save Settings</button>
                <button type="reset" class="btn-secondary">Reset</button>
            </div>
        </form>
    </div>

    <script>
        // Load current settings on page load
        async function loadSettings() {
            try {
                const response = await fetch(window.location.href + '?getState=1');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('beeperEnabled').checked = data.beeperEnabled || false;
                }
            } catch (err) {
                console.log("Could not load settings: " + err.message);
            }
        }
        
        // Load settings when page loads
        document.addEventListener('DOMContentLoaded', loadSettings);
        
        document.getElementById('setupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Explicitly get the checkbox value as boolean
            const beeperCheckbox = document.getElementById('beeperEnabled');
            const data = {
                beeperEnabled: beeperCheckbox.checked
            };
            
            console.log("Submitting data: " + JSON.stringify(data));
            
            try {
                const response = await fetch(window.location.href, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    document.getElementById('successAlert').style.display = 'block';
                    document.getElementById('errorAlert').style.display = 'none';
                    setTimeout(() => {
                        document.getElementById('successAlert').style.display = 'none';
                    }, 3000);
                } else {
                    const errorData = await response.json().catch(() => ({error: 'Unknown error'}));
                    showError('Error ' + response.status + ': ' + (errorData.error || 'Failed to save settings'));
                }
            } catch (err) {
                showError('Network error: ' + err.message);
            }
        });
        
        function showError(message) {
            const errorAlert = document.getElementById('errorAlert');
            errorAlert.textContent = message;
            errorAlert.style.display = 'block';
        }
    </script>
</body>
</html>
